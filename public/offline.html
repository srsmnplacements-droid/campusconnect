<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CampusConnect - Offline</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:#0b2545; color:#fff; font-family:Arial,Helvetica,sans-serif; text-align:center; padding:24px; }
    .box { max-width:340px; }
    .logo { width:72px; height:72px; border-radius:50%; background:#15803d; display:flex; align-items:center;
            justify-content:center; font-size:26px; font-weight:bold; margin:0 auto 16px; }
    button { margin-top:18px; padding:12px 22px; border:0; border-radius:10px; background:#15803d; color:#fff; font-size:16px; font-weight:bold; }
  </style>
</head>
<body>
  <div class="box">
    <div class="logo">SR</div>
    <h1 style="font-size:22px;margin:0 0 8px">You are offline</h1>
    <p style="margin:0;color:#cbd5e1">CampusConnect needs an internet connection. Please check your data or Wi-Fi and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
